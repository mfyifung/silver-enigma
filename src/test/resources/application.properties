# Test-only overrides: a separate SQLite file so the test suite never
# contends for a file lock with the live app instance (SQLite is single-writer),
# and never mutates the seeded production-shaped data.
spring.datasource.url=jdbc:sqlite:/workspace/data/test-app.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
