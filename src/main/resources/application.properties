server.port=8080
# Listen on all interfaces so peer boxes on the shared network can reach it.
server.address=0.0.0.0
# Embedded SQLite (file-backed) — zero external service. JPA creates the schema;
# a seeder populates it at startup, so GET endpoints serve real DB rows. The file
# lives under /workspace so it survives a restart and is inspectable from the host.
spring.datasource.url=jdbc:sqlite:/workspace/data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
